name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "stillwood $GITHUB_REF_NAME" $flags

  # Publishes to npm only when the repository has an NPM_TOKEN secret.
  npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          # npm signs a provenance statement only for public repositories.
          provenance=--provenance
          if [ "${{ github.event.repository.private }}" = true ]; then provenance=; fi
          npm publish --access public --tag "$tag" $provenance
