name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # A release branch builds and tries every binary, so you can test a release before you tag it.
  build:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: check
    uses: ./.github/workflows/build.yml
